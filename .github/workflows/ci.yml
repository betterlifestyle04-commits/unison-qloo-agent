name: UNISON quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: JavaScript syntax
        run: npm run check
      - name: Unit and integration tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E — desktop, mobile, user controls and local export
        run: npm run test:e2e
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unison-browser-screenshots
          path: browser-tests/screenshots/
          retention-days: 7
          if-no-files-found: warn
